name: CI Build & Publish

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  tests:
    name: Frontend & Backend Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend tests
        working-directory: frontend
        run: npm test -- --ci --coverage

      - name: Export web bundle
        working-directory: frontend
        env:
          EXPO_NO_TELEMETRY: '1'
          EXPO_PUBLIC_API_BASE_URL: /api/v1
        run: npx expo export --platform web --output-dir /tmp/expo-web

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend deps
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Backend tests
        working-directory: backend
        env:
          MONGODB_TEST_URI: mongodb://127.0.0.1:27017
          REQUIRE_MONGO: '0'
        run: pytest -q -rs

  build-and-publish:
    name: Build Docker and Publish (GHCR)
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest

      - name: Create release with image tag
        uses: ncipollo/release-action@v1
        with:
          tag: "deploy-${{ github.sha }}"
          name: "Image: ${{ github.sha }}"
          body: |
            Docker image pushed to GHCR:
            - ghcr.io/${{ github.repository }}:${{ github.sha }}

