name: Frontend

on:
  push:
    branches: ['**']
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

defaults:
  run:
    working-directory: frontend

jobs:
  quality:
    name: Lint, types et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Vérification des types
        run: npm run typecheck

      - name: Tests unitaires
        run: npm test -- --ci --coverage

      - name: Bundle Metro (Android)
        # Vérifie que l'app se bundle réellement : une route ou un import cassé
        # échappe au typecheck mais pas à Metro.
        run: npx expo export --platform android --output-dir /tmp/expo-export
        env:
          EXPO_NO_TELEMETRY: '1'
